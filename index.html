
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindSpace — Mood Journal</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <h1>🧠 MindSpace</h1>
    <p class="subtitle">Write your thoughts, track your mood 💭</p>

    <textarea id="entry" placeholder="How are you feeling today?"></textarea>
    <button id="saveBtn">Save Entry</button>

    <div class="mood-display">
      <h3>Today's Mood: <span id="mood">--</span></h3>
    </div>

    <h2>Recent Entries</h2>
    <ul id="entriesList"></ul>

    <h2>Mood Tracker</h2>
    <canvas id="moodChart"></canvas>
  </div>

  <script src="script.js"></script>
</body>
</html>
